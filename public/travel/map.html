<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>แผนที่เที่ยวลับแล</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>html,body,#map{height:100%;margin:0;font-family:Tahoma,sans-serif}.pin{display:flex;align-items:center;justify-content:center;border:2px solid white;border-radius:50%;background:#15476c;color:white;font:bold 14px sans-serif;box-shadow:0 1px 5px #3338}.leaflet-popup-content{line-height:1.8}.leaflet-popup-content a{display:block;padding:8px 0}#status{position:absolute;z-index:1000;background:white;bottom:28px;left:10px;max-width:85%;padding:8px;font-size:13px}</style></head><body><div id="map" aria-label="แผนที่หมุดสถานที่ลับแล"></div><p id="status" role="status">กำลังโหลดแผนที่…</p><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
async function init(){const status=document.getElementById('status');try{if(!window.L)throw Error();const r=await fetch('./places.json');if(!r.ok)throw Error();const data=await r.json();const map=L.map('map',{scrollWheelZoom:false});const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'}).addTo(map);tiles.on('tileerror',()=>{status.hidden=false;status.textContent='พื้นแผนที่โหลดไม่สำเร็จ ใช้ปุ่ม Google Maps ของแต่ละสถานที่ได้ครับ';});const bounds=[];for(const p of data.places){if(!p.map_reference)continue;const ll=[p.map_reference.latitude,p.map_reference.longitude];bounds.push(ll);const el=document.createElement('div');const title=document.createElement('strong');title.textContent=p.name;el.append(title);const detail=document.createElement('a');detail.href='/travel#'+p.id;detail.target='_top';detail.textContent='อ่านรายละเอียด';el.append(detail);if(p.navigation_url){const nav=document.createElement('a');nav.href=p.navigation_url;nav.target='_blank';nav.rel='noopener noreferrer';nav.textContent='เปิด Google Maps ↗';el.append(nav);}L.marker(ll,{title:p.name,alt:p.name,icon:L.divIcon({className:'pin',html:String(p.poster_number),iconSize:[30,30]})}).addTo(map).bindPopup(el);}map.fitBounds(bounds,{padding:[28,28]});status.hidden=true;}catch{status.textContent='โหลดแผนที่ไม่ได้ ใช้ปุ่ม Google Maps ในรายชื่อสถานที่ด้านบนได้ครับ';}}init();
</script></body></html>
